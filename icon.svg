<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1f18"/>
      <stop offset="100%" stop-color="#0a0b08"/>
    </linearGradient>
    <linearGradient id="ring1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c7e8a4"/>
      <stop offset="100%" stop-color="#4f7942"/>
    </linearGradient>
  </defs>

  <!-- Fundo -->
  <rect width="512" height="512" rx="115" fill="url(#bg1)"/>

  <!-- Anel de saldo: arco aberto com marcador na ponta -->
  <path d="M 256 106 A 150 150 0 1 1 115 204.7" fill="none" stroke="url(#ring1)" stroke-width="34" stroke-linecap="round"/>
  <circle cx="115" cy="204.7" r="18" fill="#e8f5da"/>

  <!-- Cifrão central -->
  <text x="256" y="298" font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Times New Roman', serif" font-size="112" font-weight="700" fill="url(#ring1)" text-anchor="middle">$</text>
</svg>
