<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e1e"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="greenBar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9CCC65"/>
      <stop offset="100%" stop-color="#2E7D32"/>
    </linearGradient>
  </defs>
  
  <!-- Fundo -->
  <rect width="512" height="512" rx="115" fill="url(#bg1)"/>
  
  <!-- Barras de Gráfico -->
  <rect x="120" y="280" width="60" height="120" rx="16" fill="#333333"/>
  <rect x="226" y="200" width="60" height="200" rx="16" fill="#4d4d4d"/>
  <rect x="332" y="120" width="60" height="280" rx="16" fill="url(#greenBar)"/>
  
  <!-- Linha/Seta de Crescimento -->
  <path d="M 100 300 L 250 180 L 350 90" stroke="#7CB342" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <polygon points="325,80 380,60 370,120" fill="#7CB342" transform="rotate(15 360 80)"/>
</svg>
